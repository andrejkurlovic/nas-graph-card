# ─────────────────────────────────────────────────────────────────
#  NAS Graph Card — example Lovelace configuration
# ─────────────────────────────────────────────────────────────────

# ── 1. STANDARD (Vibrant) — QNAP ────────────────────────────────
type: custom:nas-graph-card
name: QNAP
brand: qnap
theme: standard      # standard | futuristic
max_cpu: 100
max_memory: 100
max_temp: 80         # used for gauge arc % in futuristic mode
entities:
  status: binary_sensor.qnap_online
  cpu: sensor.qnap_cpu_usage
  memory: sensor.qnap_memory_usage
  temperature: sensor.qnap_system_temperature
  network_in: sensor.qnap_network_rx
  network_out: sensor.qnap_network_tx
  disk_read: sensor.qnap_disk_read
  disk_write: sensor.qnap_disk_write
  disks_total: sensor.qnap_total_disks
  disks_healthy: sensor.qnap_healthy_disks
  storage_free: sensor.qnap_volume_free
  uptime: sensor.qnap_uptime

---

# ── 2. FUTURISTIC (Neon) — Synology ─────────────────────────────
type: custom:nas-graph-card
name: Synology
brand: synology
theme: futuristic
entities:
  status: binary_sensor.synology_online
  cpu: sensor.synology_cpu_usage
  memory: sensor.synology_memory_usage
  temperature: sensor.synology_temperature
  network_in: sensor.synology_network_rx
  network_out: sensor.synology_network_tx
  disk_read: sensor.synology_disk_read
  disk_write: sensor.synology_disk_write
  disks_total: sensor.synology_total_disks
  disks_healthy: sensor.synology_healthy_disks
  storage_free: sensor.synology_volume_free
  uptime: sensor.synology_uptime

# ─────────────────────────────────────────────────────────────────
# FROSTED GLASS
# ─────────────────────────────────────────────────────────────────
# There is no frosted_glass option in this card — frosted glass is
# handled entirely by your HA theme.
#
# The card never overrides ha-card's background, border, shadow or
# backdrop-filter. When you switch to a glass theme (e.g. Mushroom
# Glass, iOS Dark, or any theme that sets --ha-card-background to a
# semi-transparent value), the card follows automatically.
#
# Tile backgrounds inside the card use rgba(0,0,0,0.20/0.30)
# overlays so they stay legible on both opaque and frosted surfaces.
#
# ─────────────────────────────────────────────────────────────────
# OTHER NOTES
# ─────────────────────────────────────────────────────────────────
# • network_in / network_out / disk_read / disk_write are
#   auto-converted: B/s → KB/s → MB/s as needed.
#
# • uptime can be seconds (integer) or a pre-formatted string.
#
# • The `status` entity is optional — omit it and the card always
#   shows "Online".
# ─────────────────────────────────────────────────────────────────
